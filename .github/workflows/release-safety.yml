name: Release safety

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan tracked files
        run: python scripts/check_release_safety.py
      - name: Check on-device downloader policy
        run: python scripts/check_downloader_policy.py
      - name: Test the downloader policy checker
        run: python tests/test_downloader_policy.py
