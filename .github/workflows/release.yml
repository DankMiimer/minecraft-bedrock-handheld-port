name: compatibility-and-release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: testing
        type: choice
        options: [testing, stable]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck gcc make libpng-dev
      - run: find portmaster/minecraftbedrock bottomscreen/release scripts tests tools/mcbedrock-get -name '*.sh' -type f -print0 | xargs -0 shellcheck -S error
      - run: bash tests/run_all.sh

  compatibility-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_compat_docs.py --check

  clients:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            edition: standard
          - arch: armhf
            edition: standard
          - arch: aarch64
            edition: rgds
    steps:
      - uses: actions/checkout@v4
      - name: Pinned client build
        run: |
          mkdir -p build/container-output
          docker build --file build/clients/Dockerfile \
            --build-arg TARGET_ARCH=${{ matrix.arch }} \
            --build-arg EDITION=${{ matrix.edition }} \
            --output type=local,dest=build/container-output .
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.arch }}-${{ matrix.edition }}
          path: build/container-output/mcpelauncher-client.${{ matrix.arch }}.${{ matrix.edition }}
          if-no-files-found: error

  companions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/container-output
          docker build --file build/companions/Dockerfile \
            --output type=local,dest=build/container-output .
      - uses: actions/upload-artifact@v4
        with:
          name: rgds-companions
          path: |
            build/container-output/bottomd
            build/container-output/bedrockmap
            build/container-output/crusty-context-v1.so
          if-no-files-found: error

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/mcbedrock-get/requirements.txt
      - name: Helper unit tests
        working-directory: tools/mcbedrock-get
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build deterministic Windows bundle
        working-directory: tools/mcbedrock-get
        shell: cmd
        run: build.bat
      - name: Smoke-test executable
        working-directory: tools/mcbedrock-get
        run: |
          $help = & .\dist\mcbedrock-get.exe --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch "--logout") {
            throw "Windows helper CLI smoke test failed"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-helper
          path: tools/mcbedrock-get/dist/mcbedrock-get-windows-v*.zip
          if-no-files-found: error

  reproducibility:
    needs: [host-tests, compatibility-docs, clients, companions, windows-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: build/release-inputs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rgds-companions
          path: build/release-inputs
      - uses: actions/download-artifact@v4
        with:
          name: windows-helper
          path: build/release-inputs
      - name: Assemble twice and compare
        env:
          CHANNEL: ${{ inputs.channel || 'testing' }}
        run: |
          VERSION=$(cat VERSION)
          COMMON_ARGS="--version $VERSION --channel $CHANNEL \
            --standard-arm64-client build/release-inputs/mcpelauncher-client.aarch64.standard \
            --standard-armhf-client build/release-inputs/mcpelauncher-client.armhf.standard \
            --rgds-client build/release-inputs/mcpelauncher-client.aarch64.rgds \
            --bottomd build/release-inputs/bottomd \
            --bedrockmap build/release-inputs/bedrockmap \
            --context-bridge build/release-inputs/crusty-context-v1.so \
            --extra-asset build/release-inputs/mcbedrock-get-windows-v$VERSION.zip"
          python3 scripts/build_releases.py $COMMON_ARGS --out-dir dist/release
          python3 scripts/build_releases.py $COMMON_ARGS --out-dir dist/release-repeat
          diff -qr dist/release dist/release-repeat
          python3 scripts/check_release_safety.py \
            --zip dist/release/minecraftbedrock-standard-v$VERSION.zip \
            --zip dist/release/minecraftbedrock-rgds-v$VERSION.zip \
            --zip dist/release/minecraftbedrock-source-v$VERSION.zip \
            --zip dist/release/mcbedrock-get-windows-v$VERSION.zip
      - uses: actions/upload-artifact@v4
        with:
          name: minecraftbedrock-release
          path: dist/release/*
          if-no-files-found: error
